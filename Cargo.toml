[package]
name = "pgsum"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Polygenic score calculation from single-sample gVCFs, with reference-block-aware genotype rules"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DylanCosto/pgsum"
readme = "README.md"
keywords = ["bioinformatics", "genomics", "polygenic", "gvcf", "pgs"]
categories = ["science", "command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "pgsum"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
