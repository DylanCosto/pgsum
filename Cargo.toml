[package]
name = "pgsum"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Polygenic score calculation from single-sample gVCFs, with reference-block-aware genotype rules"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DylanCosto/pgsum"
readme = "README.md"
keywords = ["bioinformatics", "genomics", "polygenic", "gvcf", "pgs"]
categories = ["science", "command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "pgsum"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
memmap2 = "0.9.11"
noodles-bgzf = { version = "0.45.0", features = ["libdeflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2"
zstd = { version = "0.14.0", features = ["zstdmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
