[package]
name = "pgsum"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "Polygenic score calculation from gVCFs: exact observed sums, reference-block-aware genotype rules, optional frequency filling"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DylanCosto/pgsum"
readme = "README.md"
keywords = ["bioinformatics", "genomics", "polygenic", "gvcf", "pgs"]
categories = ["science", "command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "pgsum"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
fs2 = "0.4.3"
memchr = "2.8.3"
memmap2 = "0.9.11"
noodles-bcf = "0.81.0"
noodles-bgzf = { version = "0.45.0", features = ["libdeflate"] }
noodles-vcf = "0.83.0"
num-bigint = "0.5.1"
num-traits = "0.2.19"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2"
ureq = "3.4.2"
zstd = { version = "0.14.0", features = ["zstdmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
