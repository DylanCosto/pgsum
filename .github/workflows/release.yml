name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Cross-compiled targets are built but not tested (the same code is tested on the native targets).
      - if: ${{ !matrix.cross }}
        run: cargo test --release --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=pgsum-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/pgsum README.md DESIGN.md LICENSE-APACHE LICENSE-MIT "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: pgsum-*.tar.gz*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          pgsum @TAG@ (early development). See the README for what pgsum does, what has been
          validated and its limitations, and the commit history for what changed.

          Each archive holds the `pgsum` binary, README, DESIGN and licences; check it against its `.sha256`.
          Scoring files are not included: download them from the PGS Catalog (`pgsum fetch`).
          NOTES
          sed -i "s/@TAG@/$GITHUB_REF_NAME/" notes.md
          gh release create "$GITHUB_REF_NAME" pgsum-*.tar.gz* --repo "$GITHUB_REPOSITORY" \
            --title "pgsum $GITHUB_REF_NAME" --notes-file notes.md

